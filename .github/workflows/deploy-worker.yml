name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace worker
      - run: npm run test --workspace worker
      - name: Create Worker config
        run: |
          node <<'NODE'
          const fs = require("fs");

          const value = (name, fallback) => process.env[name] || fallback;
          const tomlString = (input) => JSON.stringify(input);

          const config = `name = ${tomlString(value("WORKER_NAME", "ugyfelkozpont-api"))}
          main = "src/index.ts"
          compatibility_date = "2026-05-18"
          workers_dev = true
          preview_urls = false

          [[d1_databases]]
          binding = "DB"
          database_name = ${tomlString(value("D1_DATABASE_NAME", "ugyfelkozpont"))}
          database_id = ${tomlString(value("D1_DATABASE_ID", ""))}

          [[kv_namespaces]]
          binding = "RATE_LIMIT_KV"
          id = ${tomlString(value("KV_NAMESPACE_ID", ""))}

          [vars]
          OPENAI_MODEL = ${tomlString(value("OPENAI_MODEL", "gpt-5-nano"))}
          OPENAI_REVIEW_MODEL = ${tomlString(value("OPENAI_REVIEW_MODEL", "gpt-5-nano"))}
          SITE_URL = ${tomlString(value("SITE_URL", "https://xn--gyfelszolgalat-fsb.hu"))}
          ALLOWED_ORIGINS = ${tomlString(value("ALLOWED_ORIGINS", "https://xn--gyfelszolgalat-fsb.hu,https://epatrik107.github.io"))}
          EMAIL_FROM = ${tomlString(value("EMAIL_FROM", "Ügyfélközpont <noreply@xn--gyfelszolgalat-fsb.hu>"))}
          DEMO_MODE = ${tomlString(value("DEMO_MODE", "true"))}
          PAYMENTS_ENABLED = ${tomlString(value("PAYMENTS_ENABLED", "false"))}

          [triggers]
          crons = [ "17 2 * * *" ]
          `;

          if (!process.env.D1_DATABASE_ID || !process.env.KV_NAMESPACE_ID) {
            throw new Error("Missing D1_DATABASE_ID or KV_NAMESPACE_ID GitHub variable.");
          }

          fs.writeFileSync("worker/wrangler.toml", config.replace(/^          /gm, ""));
          NODE
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          DEMO_MODE: ${{ vars.DEMO_MODE }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
      - name: Sync Worker secrets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const keys = [
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
            "OPENAI_API_KEY",
            "TURNSTILE_SECRET_KEY",
            "TOKEN_HASH_SECRET",
            "RESEND_API_KEY",
            "DEMO_ACCESS_CODE"
          ];
          const secrets = {};
          for (const key of keys) {
            if (process.env[key]) secrets[key] = process.env[key];
          }
          fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify(secrets));
          NODE
          npx wrangler secret bulk /tmp/worker-secrets.json --config worker/wrangler.toml
          rm /tmp/worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEMO_ACCESS_CODE: ${{ secrets.DEMO_ACCESS_CODE }}
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
