name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace worker
      - run: npm run test --workspace worker
      - name: Create Worker config
        run: |
          node <<'NODE'
          const fs = require("fs");

          const value = (name, fallback) => process.env[name] || fallback;
          const tomlString = (input) => JSON.stringify(input);

          const config = `name = ${tomlString(value("WORKER_NAME", "ugyfelkozpont-api"))}
          main = "src/index.ts"
          compatibility_date = "2026-05-18"
          workers_dev = true
          preview_urls = false

          [[d1_databases]]
          binding = "DB"
          database_name = ${tomlString(value("D1_DATABASE_NAME", "ugyfelkozpont"))}
          database_id = ${tomlString(value("D1_DATABASE_ID", "da3cbef7-ebe2-4bdd-ac7e-0c3f3e9b1585"))}

          [[kv_namespaces]]
          binding = "RATE_LIMIT_KV"
          id = ${tomlString(value("KV_NAMESPACE_ID", "330e31489f97415989d94972003b0202"))}

          [vars]
          GEMINI_MODEL = ${tomlString(value("GEMINI_MODEL", "gemini-3.1-flash-lite"))}
          GEMINI_MODEL_PREMIUM = ${tomlString(value("GEMINI_MODEL_PREMIUM", "gemini-3.5-flash"))}
          GEMINI_REVIEW_MODEL = ${tomlString(value("GEMINI_REVIEW_MODEL", "gemini-3.1-flash-lite"))}
          SITE_URL = ${tomlString(value("SITE_URL", "https://ügyfelszolgalat.hu"))}
          ALLOWED_ORIGINS = ${tomlString(value("ALLOWED_ORIGINS", "https://ügyfelszolgalat.hu,https://epatrik107.github.io,http://xn--gyfelszolgalat-fsb.hu,https://xn--gyfelszolgalat-fsb.hu"))}
          EMAIL_FROM = ${tomlString(value("EMAIL_FROM", "Ügyfélközpont <noreply@ügyfelszolgalat.hu>"))}
          DEMO_MODE = ${tomlString(value("DEMO_MODE", "true"))}
          PAYMENTS_ENABLED = ${tomlString(value("PAYMENTS_ENABLED", "false"))}
          SELLER_NAME = ${tomlString(value("SELLER_NAME", "Test"))}
          SELLER_ADDRESS = ${tomlString(value("SELLER_ADDRESS", "Test"))}
          SELLER_TAX_NUMBER = ${tomlString(value("SELLER_TAX_NUMBER", "00000XXXXXX"))}

          [triggers]
          crons = [ "17 2 * * *" ]
          `;

          fs.writeFileSync("worker/wrangler.toml", config.replace(/^          /gm, ""));
          NODE
      - name: Debug generated wrangler.toml
        run: cat worker/wrangler.toml
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_PREMIUM: ${{ vars.GEMINI_MODEL_PREMIUM }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          DEMO_MODE: ${{ vars.DEMO_MODE }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          SELLER_NAME: ${{ vars.SELLER_NAME }}
          SELLER_ADDRESS: ${{ vars.SELLER_ADDRESS }}
          SELLER_TAX_NUMBER: ${{ vars.SELLER_TAX_NUMBER }}
      - name: Sync Worker secrets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const keys = [
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
            "GEMINI_API_KEY",
            "TURNSTILE_SECRET_KEY",
            "TOKEN_HASH_SECRET",
            "RESEND_API_KEY",
            "DEMO_ACCESS_CODE"
          ];
          const secrets = {};
          for (const key of keys) {
            if (process.env[key]) secrets[key] = process.env[key];
          }
          fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify(secrets));
          NODE
          npx wrangler secret bulk /tmp/worker-secrets.json --config worker/wrangler.toml
          rm /tmp/worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEMO_ACCESS_CODE: ${{ secrets.DEMO_ACCESS_CODE }}
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
