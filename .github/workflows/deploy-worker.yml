name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate production config
        run: |
          node <<'NODE'
          const errors = [];
          const defaultAllowedOrigins = "https://xn--gyfelszolgalat-fsb.hu,https://epatrik107.github.io";

          const d1Id = (process.env.CLOUDFLARE_D1_DATABASE_ID || "").trim();
          const kvId = (process.env.CLOUDFLARE_KV_NAMESPACE_ID || "").trim();
          const deployEnv = (process.env.DEPLOY_ENV || "demo").trim();
          const demoMode = (process.env.DEMO_MODE || (deployEnv === "production" ? "false" : "true")).trim();
          const paymentsEnabled = (process.env.PAYMENTS_ENABLED || (deployEnv === "production" ? "true" : "false")).trim();
          const allowedOrigins = (process.env.ALLOWED_ORIGINS || defaultAllowedOrigins).trim();
          const hasSzamlazzAgentKey = Boolean((process.env.SZAMLAZZ_AGENT_KEY || "").trim());
          const d1DatabaseIdPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          const kvNamespaceIdPattern = /^[0-9a-f]{32}$/i;

          if (!d1Id) errors.push("CLOUDFLARE_D1_DATABASE_ID is required but not set.");
          else if (!d1DatabaseIdPattern.test(d1Id)) {
            errors.push("CLOUDFLARE_D1_DATABASE_ID must be the D1 database UUID, not the database name.");
          }
          if (!kvId) errors.push("CLOUDFLARE_KV_NAMESPACE_ID is required but not set.");
          else if (!kvNamespaceIdPattern.test(kvId)) {
            errors.push("CLOUDFLARE_KV_NAMESPACE_ID must be the KV namespace ID from Wrangler.");
          }

          if (deployEnv === "production") {
            if (demoMode === "true") errors.push("DEMO_MODE=true is not allowed in production.");
            if (paymentsEnabled === "false") errors.push("PAYMENTS_ENABLED=false is not allowed in production.");
            if (!hasSzamlazzAgentKey) errors.push("SZAMLAZZ_AGENT_KEY is required in production.");
            if (allowedOrigins.split(",").some(o => o.trim().startsWith("http://"))) {
              errors.push("ALLOWED_ORIGINS contains http:// origin(s). Only HTTPS is allowed in production.");
            }
          }

          if (errors.length > 0) {
            console.error("Production config validation failed:");
            for (const e of errors) console.error("  ✗ " + e);
            process.exit(1);
          }

          console.log("Production config validation passed (env=" + deployEnv + ").");
          NODE
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          DEMO_MODE: ${{ vars.DEMO_MODE }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
          SZAMLAZZ_AGENT_KEY: ${{ secrets.SZAMLAZZ_AGENT_KEY }}
      - name: Create Worker config
        env:
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_PREMIUM: ${{ vars.GEMINI_MODEL_PREMIUM }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          DEMO_MODE: ${{ vars.DEMO_MODE }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          SELLER_NAME: ${{ vars.SELLER_NAME }}
          SELLER_ADDRESS: ${{ vars.SELLER_ADDRESS }}
          SELLER_TAX_NUMBER: ${{ vars.SELLER_TAX_NUMBER }}
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const value = (name, fallback) => (process.env[name] || fallback).trim();
          const tomlString = (input) => JSON.stringify(input);
          const deployEnv = value("DEPLOY_ENV", "demo");
          const defaultAllowedOrigins = "https://xn--gyfelszolgalat-fsb.hu,https://epatrik107.github.io";
          const defaultDemoMode = deployEnv === "production" ? "false" : "true";
          const defaultPaymentsEnabled = deployEnv === "production" ? "true" : "false";

          const config = `name = ${tomlString(value("WORKER_NAME", "ugyfelkozpont-api"))}
          main = "src/index.ts"
          compatibility_date = "2026-05-18"
          workers_dev = true
          preview_urls = false

          [[d1_databases]]
          binding = "DB"
          database_name = ${tomlString(value("D1_DATABASE_NAME", "ugyfelkozpont"))}
          database_id = ${tomlString(value("D1_DATABASE_ID", ""))}
          migrations_dir = "migrations"

          [[kv_namespaces]]
          binding = "RATE_LIMIT_KV"
          id = ${tomlString(value("KV_NAMESPACE_ID", ""))}

          [vars]
          GEMINI_MODEL = ${tomlString(value("GEMINI_MODEL", "gemini-3.1-flash-lite"))}
          GEMINI_MODEL_PREMIUM = ${tomlString(value("GEMINI_MODEL_PREMIUM", "gemini-3.5-flash"))}
          GEMINI_REVIEW_MODEL = ${tomlString(value("GEMINI_REVIEW_MODEL", "gemini-3.1-flash-lite"))}
          SITE_URL = ${tomlString(value("SITE_URL", "https://xn--gyfelszolgalat-fsb.hu"))}
          ALLOWED_ORIGINS = ${tomlString(value("ALLOWED_ORIGINS", defaultAllowedOrigins))}
          EMAIL_FROM = ${tomlString(value("EMAIL_FROM", "Ügyfélközpont <noreply@xn--gyfelszolgalat-fsb.hu>"))}
          DEMO_MODE = ${tomlString(value("DEMO_MODE", defaultDemoMode))}
          PAYMENTS_ENABLED = ${tomlString(value("PAYMENTS_ENABLED", defaultPaymentsEnabled))}
          SELLER_NAME = ${tomlString(value("SELLER_NAME", "Test"))}
          SELLER_ADDRESS = ${tomlString(value("SELLER_ADDRESS", "Test"))}
          SELLER_TAX_NUMBER = ${tomlString(value("SELLER_TAX_NUMBER", "00000XXXXXX"))}

          [triggers]
          crons = [ "17 2 * * *" ]
          `;

          fs.writeFileSync("worker/wrangler.toml", config.replace(/^          /gm, ""));
          NODE
      - name: Verify Cloudflare D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const d1Id = (process.env.D1_DATABASE_ID || "").trim();
          const config = fs.readFileSync("worker/wrangler.toml", "utf8");

          if (!config.includes(`database_id = "${d1Id}"`)) {
            console.error("Generated worker/wrangler.toml does not contain the configured D1 database_id.");
            process.exit(1);
          }

          console.log(`Generated Worker config contains D1 database_id ending in ${d1Id.slice(-6)}.`);
          NODE

          npx wrangler d1 list --json --config worker/wrangler.toml > /tmp/d1-databases.json

          node <<'NODE'
          const fs = require("fs");

          const d1Id = (process.env.D1_DATABASE_ID || "").trim();
          const payload = JSON.parse(fs.readFileSync("/tmp/d1-databases.json", "utf8"));
          const databases = Array.isArray(payload) ? payload : payload.result || [];
          const databaseIdFor = (db) => db.uuid || db.id || db.database_id || "";
          const match = databases.find((db) => databaseIdFor(db) === d1Id);

          if (!match) {
            const visible = databases
              .map((db) => `${db.name || "(unnamed)"} (...${databaseIdFor(db).slice(-6) || "no-id"})`)
              .join(", ") || "none";

            console.error(`Cloudflare account/token cannot see D1 database_id ending in ${d1Id.slice(-6)}.`);
            console.error(`Visible D1 databases for this account/token: ${visible}`);
            console.error("Check that CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN belong to the same account as this D1 database.");
            process.exit(1);
          }

          console.log(`Cloudflare account/token can see D1 database ${match.name || "(unnamed)"} ending in ${d1Id.slice(-6)}.`);
          NODE
      - name: Sync Worker secrets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const keys = [
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
            "GEMINI_API_KEY",
            "TURNSTILE_SECRET_KEY",
            "TOKEN_HASH_SECRET",
            "RESEND_API_KEY",
            "DEMO_ACCESS_CODE",
            "SZAMLAZZ_AGENT_KEY"
          ];
          const secrets = {};
          for (const key of keys) {
            if (process.env[key]) secrets[key] = process.env[key];
          }
          fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify(secrets));
          NODE
          npx wrangler secret bulk /tmp/worker-secrets.json --config worker/wrangler.toml
          rm /tmp/worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEMO_ACCESS_CODE: ${{ secrets.DEMO_ACCESS_CODE }}
          SZAMLAZZ_AGENT_KEY: ${{ secrets.SZAMLAZZ_AGENT_KEY }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ugyfelkozpont --remote --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
