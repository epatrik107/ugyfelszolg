name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace worker
      - run: npm run test --workspace worker
      - name: Sync Worker secrets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const keys = [
            "STRIPE_SECRET_KEY",
            "STRIPE_WEBHOOK_SECRET",
            "OPENAI_API_KEY",
            "TURNSTILE_SECRET_KEY",
            "TOKEN_HASH_SECRET",
            "RESEND_API_KEY",
            "DEMO_ACCESS_CODE"
          ];
          const secrets = {};
          for (const key of keys) {
            if (process.env[key]) secrets[key] = process.env[key];
          }
          fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify(secrets));
          NODE
          npx wrangler secret bulk /tmp/worker-secrets.json --config worker/wrangler.toml
          rm /tmp/worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEMO_ACCESS_CODE: ${{ secrets.DEMO_ACCESS_CODE }}
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
