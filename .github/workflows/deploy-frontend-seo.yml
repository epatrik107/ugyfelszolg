name: Apply frontend SEO rules
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-seo-rules
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only managed SEO rules
        run: node scripts/apply-frontend-seo-rules.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify SEO headers and redirects
        run: node scripts/check-frontend-seo-edge.mjs
