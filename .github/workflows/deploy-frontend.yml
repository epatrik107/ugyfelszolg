name: Deploy frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected production branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production frontend deployment is only allowed from main."
            exit 1
          fi

  build:
    needs: validate-source
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate frontend production config
        run: |
          node <<'NODE'
          const errors = [];
          const apiBaseUrl = (process.env.VITE_API_BASE_URL || "").trim();
          const basePath = (process.env.VITE_BASE_PATH || "").trim();
          const siteUrl = (process.env.VITE_SITE_URL || "").trim();
          const demoMode = (process.env.VITE_DEMO_MODE || "").trim();
          const turnstileSiteKey = (process.env.VITE_TURNSTILE_SITE_KEY || "").trim();

          const isHttps = (value) => {
            try {
              return new URL(value).protocol === "https:";
            } catch {
              return false;
            }
          };

          if (!apiBaseUrl || !isHttps(apiBaseUrl)) {
            errors.push("VITE_API_BASE_URL must be a production HTTPS origin.");
          }
          if (apiBaseUrl) {
            try {
              const apiUrl = new URL(apiBaseUrl);
              if (apiUrl.hostname.endsWith(".workers.dev")) {
                errors.push("VITE_API_BASE_URL must use the protected custom API domain, not workers.dev.");
              }
              if (apiUrl.pathname !== "/" || apiUrl.search || apiUrl.hash) {
                errors.push("VITE_API_BASE_URL must be an origin without path, query, or fragment.");
              }
            } catch {
              // The general HTTPS validation above reports malformed URLs.
            }
          }
          if (!siteUrl || !isHttps(siteUrl)) {
            errors.push("VITE_SITE_URL must be a production HTTPS URL.");
          }
          if (siteUrl) {
            try {
              if (new URL(siteUrl).hostname.endsWith(".github.io")) {
                errors.push("VITE_SITE_URL must use the production custom domain.");
              }
            } catch {
              // The general HTTPS validation above reports malformed URLs.
            }
          }
          if (!basePath || !basePath.startsWith("/")) {
            errors.push("VITE_BASE_PATH must be set explicitly and start with /.");
          }
          if (demoMode !== "false") {
            errors.push("VITE_DEMO_MODE must be false for production frontend deploys.");
          }
          if (!turnstileSiteKey) {
            errors.push("VITE_TURNSTILE_SITE_KEY is required.");
          }

          if (errors.length > 0) {
            console.error("Frontend deploy config validation failed:");
            for (const error of errors) console.error("  ✗ " + error);
            process.exit(1);
          }
          console.log("Frontend deploy config validation passed.");
          NODE
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE }}
      - run: npm run build --workspace frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
