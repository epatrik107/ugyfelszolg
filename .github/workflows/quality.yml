name: Quality checks

on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install browser for customer flow tests
        run: npx playwright install --with-deps chromium
      - name: Test customer flows on desktop and mobile
        run: npm run test:e2e --workspace frontend
      - run: npm audit --audit-level=moderate
      - name: Secret scan
        run: |
          if git grep -lE 'sk_live_[A-Za-z0-9]{20,}|rk_live_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{24,}|AIza[0-9A-Za-z_-]{30,}' -- .; then
            echo "Potential production credential found in tracked files."
            exit 1
          fi
      - name: Migration dry-run with foreign keys
        run: node scripts/check-migrations.mjs
