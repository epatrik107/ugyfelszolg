<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Envelope body -->
  <rect x="5" y="10" width="22" height="14" rx="2" fill="white" opacity="0.95"/>
  <!-- Envelope flap (V shape) -->
  <polyline points="5,10 16,19 27,10" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Envelope bottom crease lines -->
  <line x1="5" y1="24" x2="12" y2="18" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="27" y1="24" x2="20" y2="18" stroke="#cbd5e1" stroke-width="1"/>
</svg>
